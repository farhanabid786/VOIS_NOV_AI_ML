services:
  - type: web
    name: vois-cardio-risk-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173,https://vois-nov-ai-ml.vercel.app
